# Server 1 — Source Easy on sourceeasy.in
# Public entry: caddy (80/443) -> api (Source Easy server: REST API + web app).
# Twenty, Postgres and Redis have NO public ports. Twenty is reachable from the host only on
# 127.0.0.1:3000 (admin via SSH tunnel: ssh -L 3000:localhost:3000 vps).
name: source-easy-twenty
services:
  server:
    image: twentycrm/twenty:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
      IS_MULTIWORKSPACE_ENABLED: "false"
    # Localhost only, for admin access over an SSH tunnel. Never publish this port.
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    image: twentycrm/twenty:${TAG:-latest}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${APP_SECRET}
      DISABLE_DB_MIGRATIONS: "true"
    depends_on:
      server: { condition: service_healthy }
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bound to localhost only, used by the nightly pg_dump script.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER} -h localhost -d default
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    restart: unless-stopped
  api:
    build: { context: ../.., dockerfile: server/Dockerfile }
    restart: unless-stopped
    environment:
      TWENTY_URL: http://server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-12h}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      BACKUP_LINKS: ${BACKUP_LINKS:-[]}
      USERS_DB: /data/users.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - api-data:/data
    depends_on:
      server: { condition: service_healthy }
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
volumes:
  db-data:
  server-local-data:
  caddy-data:
  api-data:
