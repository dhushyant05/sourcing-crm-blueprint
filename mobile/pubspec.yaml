name: source_easy
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.8+10

environment:
  sdk: ^3.9.2

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  provider: ^6.1.5+1
  share_plus: ^12.0.2
  sqflite: ^2.4.2
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7+1
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/launcher_fg.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/brand/launcher_mono.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansSC-GB2312.ttf
    - assets/brand/mark.png
    - assets/brand/lockup.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

dependency_overrides:
  # image 4.11 needs ZLibDecoder.decodeLazy (archive >=4.0.10); something pins 4.0.9
  archive: ^4.0.10
