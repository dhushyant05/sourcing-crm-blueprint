name: source_easy_customer
description: "Source Easy Customer: the customer portal as an Android app."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.9.2

dependencies:
  crypto: ^3.0.8
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
